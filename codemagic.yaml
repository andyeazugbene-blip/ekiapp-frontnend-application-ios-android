# Codemagic iOS App Store workflow for Eki.
# In Codemagic, create an App Store Connect integration named `codemagic`
# using:
# - Key ID: 7YYBX34NY6
# - Issuer ID: 8ffc7119-ddb0-423b-a60a-f43c38c897ca
# - The private key from App Store Connect UI
# Keep the private key in Codemagic only. Do not commit it to git.

workflows:
  ios-app-store:
    name: Eki iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic
    environment:
      node: 20.18.0
      xcode: 16.4
      cocoapods: default
      vars:
        APP_NAME: Eki
        BUNDLE_ID: com.ekiapp.mobile
        XCODE_WORKSPACE: ios/Eki.xcworkspace
        XCODE_SCHEME: Eki
        EXPO_USE_LOCAL_CLI: "1"
        EXPO_NO_CAPABILITY_SYNC: "1"
        CI: "1"
        EXPO_PUBLIC_USE_MOCK_API: "false"
        EXPO_PUBLIC_API_URL: "https://ekiapp-backend.vercel.app"
        EXPO_PUBLIC_API_BASE_URL: "https://ekiapp-backend.vercel.app"
        EXPO_PUBLIC_APP_WEBSITE: "https://culinarytales.app"
        EXPO_PUBLIC_APP_DOWNLOAD_LINK: "https://culinarytales.app"
        EXPO_PUBLIC_PUBLIC_WEB_URL: "https://culinarytales.app"
        EXPO_PUBLIC_PUBLIC_WEB_URL_WWW: "https://www.culinarytales.app"
        EXPO_PUBLIC_STORE_BASE_URL: "https://culinarytales.app/store"
        EXPO_PUBLIC_VERCEL_FALLBACK_URL: "https://ekiapp-backend.vercel.app"
        EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_YXkYBZjPTymtICNHwFSHX9Hg"
        EXPO_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAADbdUSFvS7twWicQ"
        EXPO_PUBLIC_APP_REVIEW_MODE: "false"
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - ~/Library/Developer/Xcode/DerivedData
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Generate iOS project from Expo config
        script: npx expo prebuild --platform ios --clean --non-interactive
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
      - name: Apply App Store signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
