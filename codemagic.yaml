# Codemagic iOS App Store workflow for Eki.
# In Codemagic:
# 1. Create or use an App Store Connect integration named `EKI`
# 2. Upload or fetch the Apple Distribution certificate as `Eki`
# 3. Upload or fetch the provisioning profile as `Eki`
# The uploaded provisioning profile currently targets:
# - Bundle ID: com.ekiapp.mobilee
# Keep private keys and certificate passwords in Codemagic only. Do not commit them to git.

workflows:
  ios-app-store:
    name: Eki iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: EKI
    environment:
      node: 20.18.0
      xcode: latest
      cocoapods: default
      ios_signing:
        certificates:
          - Eki
        provisioning_profiles:
          - Eki
      vars:
        APP_NAME: Eki
        BUNDLE_ID: com.ekiapp.mobilee
        XCODE_WORKSPACE: ios/Eki.xcworkspace
        XCODE_SCHEME: Eki
        EXPO_USE_LOCAL_CLI: "1"
        EXPO_NO_CAPABILITY_SYNC: "1"
        CI: "1"
        EXPO_PUBLIC_USE_MOCK_API: "false"
        EXPO_PUBLIC_API_URL: "https://ekiapp-backend.vercel.app"
        EXPO_PUBLIC_API_BASE_URL: "https://ekiapp-backend.vercel.app"
        EXPO_PUBLIC_APP_WEBSITE: "https://culinarytales.app"
        EXPO_PUBLIC_APP_DOWNLOAD_LINK: "https://culinarytales.app"
        EXPO_PUBLIC_PUBLIC_WEB_URL: "https://culinarytales.app"
        EXPO_PUBLIC_PUBLIC_WEB_URL_WWW: "https://www.culinarytales.app"
        EXPO_PUBLIC_STORE_BASE_URL: "https://culinarytales.app/store"
        EXPO_PUBLIC_VERCEL_FALLBACK_URL: "https://ekiapp-backend.vercel.app"
        EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_YXkYBZjPTymtICNHwFSHX9Hg"
        EXPO_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAADbdUSFvS7twWicQ"
        EXPO_PUBLIC_APP_REVIEW_MODE: "false"
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - ~/Library/Developer/Xcode/DerivedData
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Patch Stripe iOS PaymentSheet build
        script: node scripts/patch-stripe-react-native-ios.js
      - name: Generate iOS project from Expo config
        script: npx expo prebuild --platform ios --clean --non-interactive
      - name: Initialize keychain
        script: keychain initialize
      - name: Add signing certificates to keychain
        script: keychain add-certificates
      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod install || {
            pod repo update
            pod install
          }
      - name: Apply App Store signing profiles
        script: |
          xcode-project use-profiles \
            --export-options-plist=/Users/builder/export_options.plist \
            --code-signing-setup-verbose-logging
      - name: Check iOS signing settings
        script: |
          set -e
          echo "Expected bundle id: $BUNDLE_ID"
          echo "Installed provisioning profiles:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true
          echo "Archive signing build settings:"
          xcodebuild -workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -showBuildSettings \
            | grep -E "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|PROVISIONING_PROFILE" || true
          echo "Export options:"
          cat /Users/builder/export_options.plist
      - name: Build IPA
        script: |
          set -euo pipefail
          mkdir -p /tmp/xcodebuild_logs

          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            | tee /tmp/xcodebuild_logs/build-ipa.log
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /Users/builder/export_options.plist
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
